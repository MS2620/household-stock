services:
  postgres:
    image: postgres:16-alpine
    container_name: household-stock-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: household_stock
      POSTGRES_USER: household
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - household-stock-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U household -d household_stock"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: household-stock-app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://household:change-this-password@postgres:5432/household_stock
      QUICK_ADD_TOKEN: change-this-to-a-random-secret
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --hostname 0.0.0.0

volumes:
  household-stock-postgres: