name: Home Assistant integration

on:
  pull_request:
    paths:
      - "custom_components/household_stock/**"
      - "tests/**"
      - ".github/workflows/home-assistant-integration.yml"
  push:
    branches:
      - home-assistant-integration
    paths:
      - "custom_components/household_stock/**"
      - "tests/**"
      - ".github/workflows/home-assistant-integration.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile integration
        run: python -m compileall -q custom_components/household_stock
      - name: Validate dashboard card
        run: node --check custom_components/household_stock/www/household-stock-card.js
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Static validation
        run: ruff check --select E9,F custom_components/household_stock
      - name: Run model tests
        run: pytest -q tests/test_models.py
      - name: Run integration tests
        run: pytest -q tests/test_integration.py
